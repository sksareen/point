<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3949"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1E7EE"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g transform="translate(-40 10)">
    <g filter="url(#sh)" fill="url(#skin)" stroke="#17212C" stroke-width="13" stroke-linejoin="round">
      <!-- cuff -->
      <rect x="452" y="790" width="210" height="70" rx="18" fill="#C9D2DC"/>
      <!-- fist body -->
      <rect x="430" y="520" width="250" height="290" rx="70"/>
      <!-- curled fingertips stacked on the right -->
      <rect x="540" y="540" width="170" height="78" rx="39"/>
      <rect x="540" y="612" width="166" height="78" rx="39"/>
      <rect x="540" y="684" width="156" height="78" rx="39"/>
      <!-- index finger -->
      <rect x="440" y="300" width="108" height="330" rx="54"/>
      <!-- thumb tucked across -->
      <path d="M430 690 Q430 632 486 632 L566 640 Q604 646 604 684 Q604 724 566 728 L486 738 Q430 742 430 690 Z"/>
    </g>
    <path d="M464 520 Q494 530 524 520" fill="none" stroke="#17212C" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
    <!-- loop around the fingertip -->
    <path d="M500 196 C 628 190, 676 260, 650 330 C 622 404, 510 420, 430 398 C 352 374, 330 300, 372 246 C 406 202, 468 188, 548 200"
          fill="none" stroke="#FF2E40" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
